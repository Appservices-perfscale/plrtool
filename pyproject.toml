[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plrtool"
dynamic = ["version"]
description = "PipelineRun toolkit for kube-shard load tests: wait, download/cache, timing, errors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kubernetes",
    "matplotlib",
    "pyyaml",
]

[project.scripts]
plrtool = "plrtool.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.hatch.version]
path = "src/plrtool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/plrtool"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
