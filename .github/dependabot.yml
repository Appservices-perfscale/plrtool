version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    target-branch: main
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    target-branch: main
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
