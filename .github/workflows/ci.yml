name: CI

# Runs on every PR and on demand; enforced quality gates protect main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch/ref; a new push cancels the in-flight run for it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Single job pipeline: bootstrap -> checks -> type check -> coverage -> audit.
    name: bootstrap / check-all / test / coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Configure uv tool bin dir (pre-commit) on env + PATH
        run: |
          echo "UV_TOOL_BIN_DIR=$HOME/.local/bin" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Bootstrap
        run: make bootstrap

      - name: "Checks (pre-commit: ruff, format, bandit, gitleaks, ...)"
        run: make check-all

      - name: Tests (pytest)
        run: make test

      - name: Type check (mypy)
        run: make typecheck

      - name: Coverage (pytest + cov, fail_under gate)
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Dependency audit (uv/OSV + pip-audit)
        run: make audit
